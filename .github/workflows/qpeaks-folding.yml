name: qPeaks linear folding verification

on:
  pull_request:
    paths:
      - "src/qalgorithms_qpeaks.cpp"
      - "include/qalgorithms_qpeaks.h"
      - "test/test_qpeaks_folding.cpp"
      - ".github/workflows/qpeaks-folding.yml"
  workflow_dispatch:

jobs:
  folding:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libz-dev cmake g++
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Verify folding and previous multi-trace regressions
        run: ctest --test-dir build --output-on-failure -R "^test_qpeaks_(folding|multitrace)$"
      - name: Run whole suite (known legacy failures are non-gating)
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure
      - name: Upload CTest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qpeaks-folding-${{ matrix.configuration }}-ctest
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
