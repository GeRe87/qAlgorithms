name: Peak model Stage A
on:
  push:
    branches: [agent/peak-model-contract-stage-a]
  pull_request:
    paths: ['src/qalgorithms_qpeaks.cpp', 'include/qalgorithms_qpeaks.h', 'test/test_peak_model.cpp', 'test/stage_a/**', '.github/workflows/peak-model-stage-a.yml']
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y libz-dev ninja-build
      - name: Build immutable baseline before Stage A
        run: |
          git worktree add --detach ../baseline 33cf85e472559bf4ee7cfd2c83d904a3371d1973
          cp test/test_peak_model.cpp ../baseline/test/
          cmake -S ../baseline -B ../baseline-build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          cmake --build ../baseline-build --parallel 2
      - name: Build Stage A
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          cmake --build build --parallel 2
      - name: Record complete suites and verify only known failures
        shell: python
        run: |
          import subprocess, pathlib, re
          for label, folder in [('baseline','../baseline-build'),('stage','build')]:
              p=subprocess.run(['ctest','--test-dir',folder,'--output-on-failure'],capture_output=True,text=True)
              pathlib.Path(label+'-ctest.log').write_text(p.stdout+p.stderr)
              failed=set(re.findall(r'\d+ - (\S+) \([^)]*\)',p.stdout))
              assert failed=={'test_qpeaks','test_qpeaks_pt03','test_qpeaks_pt04'}, (p.returncode,p.stdout,p.stderr)
      - name: Exact independent source differential and paired benchmark
        run: python3 test/stage_a/compare.py ../baseline-build/tests_bin/test_peak_model build/tests_bin/test_peak_model | tee differential.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peak-model-stage-a-${{ matrix.config }}
          path: |
            *-ctest.log
            differential.json
