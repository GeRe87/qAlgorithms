name: Optional public TripleTOF folding pilot

on:
  pull_request:
    paths:
      - ".github/workflows/qpeaks-folding-public-qtof.yml"
  workflow_dispatch:

jobs:
  real-qtof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libz-dev cmake g++
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --parallel 2
      - name: Download public validated mzML samples from Zenodo
        run: |
          mkdir -p qtof_inputs
          curl --fail --location --retry 3 --output qtof_inputs/20171016_POOL_POS_1_105-134.mzML 'https://zenodo.org/records/20729183/files/20171016_POOL_POS_1_105-134.mzML?download=1'
          curl --fail --location --retry 3 --output qtof_inputs/20171016_POOL_POS_3_105-134.mzML 'https://zenodo.org/records/20729183/files/20171016_POOL_POS_3_105-134.mzML?download=1'
          (cd qtof_inputs && printf '%s\n' '4130309a9283c8b492660dbad1fd3670  20171016_POOL_POS_1_105-134.mzML' '8bce27a1fdbe2ea0f0659d398b0bfaaf  20171016_POOL_POS_3_105-134.mzML' | md5sum --check)
      - name: Real-data CLI smoke: 10 MS1 spectra per injection
        run: |
          mkdir -p qtof_folded
          ./build/qAlgorithms -i qtof_inputs/20171016_POOL_POS_1_105-134.mzML qtof_inputs/20171016_POOL_POS_3_105-134.mzML -o qtof_folded --peak-folding --folding-axis tof --folding-model asymmetric --folding-max-scans 10
          python3 - <<'PY'
          import csv, math
          from pathlib import Path
          for path in sorted(Path("qtof_folded").glob("*_folding.csv")):
              with path.open(newline="") as handle:
                  rows = list(csv.DictReader(handle))
              assert rows, f"Real TripleTOF folding CSV has no candidates: {path}"
              assert all(row["axis"]=="tof" and row["model"]=="asymmetric" for row in rows)
              assert all(math.isfinite(float(row["b2"])) and math.isfinite(float(row["b3"])) for row in rows)
              valid = sum(row["validApex"]=="1" for row in rows)
              scans = sorted({row["spectrumIndex"] for row in rows})
              print(f"REAL QTOF PILOT {path.name}: {len(rows)} profile candidates, {valid} valid apex positions, {len(scans)} fitted spectra.")
          PY
      - name: Upload folding CSV preview (research-only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qtof-folding-real-data-preview
          path: qtof_folded/*_folding.csv
          if-no-files-found: ignore
