name: Paired synthetic peak area
on:
  push:
    branches: [agent/peak-model-synthetic-area]
  pull_request:
    paths: ['experiments/peak_model_synthetic_area/**', '.github/workflows/peak-model-synthetic-area.yml']
jobs:
  simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the native model driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libz-dev ninja-build
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DQALGORITHMS_ENABLE_SYNTHETIC_AREA_AUDIT=ON
          cmake --build build --target synthetic_peak_area --parallel 2
      - name: Run the paired simulation and recovery checks
        run: |
          python3 -m venv .simulation-env
          .simulation-env/bin/python -m pip install -r experiments/peak_model_area_audit/requirements.txt
          .simulation-env/bin/python -B experiments/peak_model_synthetic_area/simulate.py build/synthetic_peak_area results
          git rev-parse HEAD > results/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paired-synthetic-area-evidence
          path: results/
