name: Hyperbolic intensity segments
on:
  push:
    branches: [agent/peak-model-intensity-segments]
  pull_request:
    paths: ['include/qalgorithms_intensity_segments.h', 'src/qalgorithms_intensity_segments.cpp', 'experiments/peak_model_segments/**', '.github/workflows/peak-model-intensity-segments.yml']
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure build dependencies
        timeout-minutes: 2
        run: |
          if ! command -v ninja >/dev/null || [ ! -r /usr/include/zlib.h ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 install -y libz-dev ninja-build
          fi
      - name: Install isolated audit dependencies
        run: |
          python3 -m venv ../audit-env
          ../audit-env/bin/python -m pip install -r experiments/peak_model_audit/requirements.txt
      - name: Build immutable declared-search base
        run: |
          git worktree add --detach ../baseline 6cfd2847b9067f975b222997f4e13493d1b64de3
          cmake -S ../baseline -B ../baseline-build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_CXX_FLAGS="-ffile-prefix-map=$(realpath ../baseline)=/qAlgorithms" -DQALGORITHMS_ENABLE_HYPERBOLIC_RESEARCH=ON -DQALGORITHMS_ENABLE_PEAK_BINDING_BENCH=ON -DQALGORITHMS_ENABLE_REAL_PROFILE_AUDIT=ON -DPython3_EXECUTABLE="${GITHUB_WORKSPACE}/../audit-env/bin/python"
          cmake --build ../baseline-build --parallel 2
      - name: Build audit and existing production targets
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_CXX_FLAGS="-ffile-prefix-map=${GITHUB_WORKSPACE}=/qAlgorithms" -DQALGORITHMS_ENABLE_HYPERBOLIC_RESEARCH=ON -DQALGORITHMS_ENABLE_PEAK_BINDING_BENCH=ON -DQALGORITHMS_ENABLE_REAL_INTENSITY_SEGMENTS=ON -DQALGORITHMS_ENABLE_REAL_PROFILE_AUDIT=ON -DPython3_EXECUTABLE="${GITHUB_WORKSPACE}/../audit-env/bin/python"
          cmake --build build --parallel 2
      - name: Full suites with exact known-failure accounting
        shell: python
        run: |
          import subprocess, pathlib, re
          for label,folder in [('baseline','../baseline-build'),('audit','build')]:
              p=subprocess.run(['ctest','--test-dir',folder,'--output-on-failure'],capture_output=True,text=True)
              pathlib.Path(label+'-ctest.log').write_text(p.stdout+p.stderr)
              failed=set(re.findall(r'\d+ - (\S+) \([^)]*\)',p.stdout))
              assert failed=={'test_qpeaks','test_qpeaks_pt03','test_qpeaks_pt04'},(p.returncode,p.stdout,p.stderr)
      - name: Exact legacy differential and nine paired benchmark trials
        run: python3 experiments/peak_model_binding/compare.py ../baseline-build/tests_bin/test_peak_model build/tests_bin/test_peak_model ../baseline-build/bench_peak_binding build/bench_peak_binding build/bench_peak_binding_extra | tee paired.json
      - name: Independent CLI output differential
        run: python3 experiments/peak_model_binding/compare_cli.py ../baseline-build/qAlgorithms build/qAlgorithms | tee cli-differential.log
      - name: Record exact source and compiler provenance
        run: |
          git rev-parse HEAD > provenance.txt
          c++ --version >> provenance.txt
          lscpu >> provenance.txt
      - name: Record common benchmark executable code sections
        shell: python
        run: |
          import subprocess,pathlib,hashlib
          sections=[]
          for label,folder in [('baseline','../baseline-build'),('audit','build')]:
              target=pathlib.Path(label+'-benchmark.text')
              subprocess.run(['objcopy','-O','binary','--only-section=.text',folder+'/bench_peak_binding',str(target)],check=True)
              sections.append(target.read_bytes())
          pathlib.Path('benchmark-code.txt').write_text('baseline='+hashlib.sha256(sections[0]).hexdigest()+'\nsearch='+hashlib.sha256(sections[1]).hexdigest()+'\nidentical='+str(sections[0]==sections[1])+'\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intensity-segments-${{ matrix.config }}
          path: |
            *-ctest.log
            paired.json
            benchmark-code.txt
            cli-differential.log
            provenance.txt
            build/compile_commands.json

  real_data:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ensure build dependencies
        timeout-minutes: 2
        run: |
          if ! command -v ninja >/dev/null || [ ! -r /usr/include/zlib.h ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 install -y libz-dev ninja-build
          fi
      - name: Install isolated analysis dependencies
        run: |
          python3 -m venv ../audit-env
          ../audit-env/bin/python -m pip install -r experiments/peak_model_audit/requirements.txt
      - name: Build isolated audit executable
        run: |
          cmake -S . -B build-real -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DQALGORITHMS_ENABLE_REAL_PROFILE_AUDIT=ON -DQALGORITHMS_ENABLE_REAL_INTENSITY_SEGMENTS=ON
          cmake --build build-real --target real_peak_audit real_peak_segments --parallel 2
      - name: Checksum-verified public inputs and fixed-protocol audit
        run: |
          ../audit-env/bin/python experiments/peak_model_audit/fetch.py real-data
          mkdir -p evidence
          cp real-data/input-manifest.json evidence/
          cp experiments/peak_model_audit/PROTOCOL.md evidence/
          git rev-parse HEAD > evidence/head.txt
          for injection in 1 19
          do
            ./build-real/real_peak_audit real-data/injection${injection}.mzML evidence/audit${injection}.jsonl
            ./build-real/real_peak_segments real-data/injection${injection}.mzML evidence/scans${injection}.csv evidence/windows${injection}.csv evidence/spans${injection}.csv evidence/peaks${injection}.csv
            python3 experiments/peak_model_segments/summarize.py evidence/scans${injection}.csv evidence/windows${injection}.csv evidence/audit${injection}.jsonl | tee evidence/summary${injection}.json
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-profile-segmentation-evidence
          path: evidence/
